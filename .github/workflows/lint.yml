name: Lint

# Validate the workflow and action configuration on every push and pull
# request so that broken changes (bad YAML/JSON, invalid expressions, shell
# script problems) are caught before they are copied to other repositories.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Download actionlint
        id: get-actionlint
        shell: bash
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      # actionlint checks .github/workflows/*.yml for syntax, expression types,
      # action input/output usage (including our local composite actions) and
      # shellcheck on every `run:` block.
      - name: Run actionlint
        shell: bash
        run: ${{ steps.get-actionlint.outputs.executable }} -color .github/workflows/*.yml

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            jq empty "$file" || { echo "Invalid JSON: $file"; exit 1; }
          done < <(find . -name '*.json' -not -path './.git/*' -print0)
          echo "All JSON files are valid."

      - name: Validate YAML files
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            Dir.glob(".github/**/*.{yml,yaml}").each do |f|
              YAML.load_file(f)
              puts "OK: #{f}"
            end
          '
          echo "All YAML files parse."
