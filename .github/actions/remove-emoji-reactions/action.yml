name: "Remove emoji reactions"
description: "Remove the app's own emoji reactions from a comment and/or an issue"
inputs:
  comment-id:
    description: "Comment ID to remove reactions from"
  issue-number:
    description: "Issue Number to remove reactions from"
  token:
    description: "GitHub token used for request"
    required: true
runs:
  using: "composite"
  steps:
    - shell: bash
      if: inputs.comment-id != ''
      env:
        REACTIONS_TOKEN: ${{ inputs.token }}
      run: |
        "${{ github.action_path }}/remove-reactions.sh" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/comments/${{ inputs.comment-id }}/reactions" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/comments/${{ inputs.comment-id }}/reactions"
    - shell: bash
      if: inputs.issue-number != ''
      env:
        REACTIONS_TOKEN: ${{ inputs.token }}
      run: |
        "${{ github.action_path }}/remove-reactions.sh" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${{ inputs.issue-number }}/reactions" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${{ inputs.issue-number }}/reactions"
